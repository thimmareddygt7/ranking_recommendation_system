paths:
  raw_data: "data/raw/retailrocket"
  processed_data: "data/processed"
  models: "models"
  results: "results"

data_processing:
  min_interactions: 3
  max_interactions: 500
  split_ratio: 0.85
  event_weights:
    view: 1
    addtocart: 2
    transaction: 3

retrieval:
  top_n_candidates: 100
  factors: 64
  regularization: 0.05
  iterations: 20

ranking:
  objective: "lambdarank"
  metric: "ndcg"
  eval_at: [5, 10, 20]
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 20
  num_boost_round: 150
  early_stopping_rounds: 50

serving:
  default_top_k: 10
  latency_threshold_ms: 100.0
